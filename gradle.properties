# 构建 AiCode 插件（Android Studio / IntelliJ IDEA 插件）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 部分网络（如国内）IPv6 不通而 DNS 优先返回 IPv6，强制走 IPv4 以避免依赖解析失败
systemProp.java.net.preferIPv4Stack=true

kotlin.code.style=official

# 无头/沙箱环境下 Kotlin daemon 无法写入用户目录，改为在 Gradle 进程内编译
kotlin.compiler.execution.strategy=in-process

# IntelliJ Platform 运行时已内置 Kotlin stdlib，排除 Gradle 自动引入的 stdlib 依赖，
# 避免与平台版本冲突（详见 https://jb.gg/intellij-platform-kotlin-stdlib）
kotlin.stdlib.default.dependency=false

# 插件版本号（打进 build/distributions 的 zip 名称与 plugin.xml）
pluginVersion=1.0.0
